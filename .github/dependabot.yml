version: 2

updates:
  # Python dependencies (reads pyproject.toml + uv.lock)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  # GitHub Actions workflow versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # pre-commit / prek hook revisions
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
