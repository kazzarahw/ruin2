name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    # To also test on macOS / Windows, delete the `runs-on` line below and
    # uncomment the strategy/matrix/runs-on lines above `timeout-minutes`:
    # strategy:
    #   matrix:
    #     os: [ubuntu-latest, macos-latest, windows-latest]
    # runs-on: ${{ matrix.os }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      # Refuse to run with a stale lockfile: reproducibility is the point.
      - run: uv lock --check
      - run: uv sync --frozen
      # The same gate as `make check` locally, once the lockfile is verified.
      - run: make check

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Fails if any dependency has a known vulnerability.
      - run: uv run pip-audit
